          <text y="24"  opacity="0">+%@@#:.  .:#@@%+<animate attributeName="opacity" values="0;1" begin="0.85s" dur=".3s" fill="freeze"/></text>
          <text y="48"  opacity="0"> :+#%@@@@@@%#+: <animate attributeName="opacity" values="0;1" begin="1.0s" dur=".3s" fill="freeze"/></text>
          <text y="72"  opacity="0">  .:+*#%@#*+:.  <animate attributeName="opacity" values="0;1" begin="1.15s" dur=".3s" fill="freeze"/></text>
