<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="devakikowsik-star, developer profile on GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;130%;100%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGrad2" cx="80%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="outerClip">
      <rect x="1" y="1" width="1178" height="608" rx="24"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect x="0" y="0" width="1180" height="610" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1180" height="610" fill="url(#grid)"/>
    <rect x="0" y="0" width="1180" height="610" fill="url(#glowGrad)"/>
    <rect x="0" y="0" width="1180" height="610" fill="url(#glowGrad2)"/>

    <!-- drifting particles -->
    <circle cx="140" cy="500" r="2" fill="#22D3EE" opacity="0.5">
      <animate attributeName="cy" values="500;470;500" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="120" r="2.2" fill="#7C3AED" opacity="0.45">
      <animate attributeName="cy" values="120;150;120" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="560" r="1.6" fill="#10B981" opacity="0.4">
      <animate attributeName="cy" values="560;530;560" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outer frame border -->
  <rect x="1.5" y="1.5" width="1177" height="607" rx="24" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- TERMINAL HEADER -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="24" y="24" width="1132" height="42" rx="10" fill="#0F172A" fill-opacity="0.55" stroke="#1E293B" stroke-width="1"/>
    <circle cx="46" cy="45" r="5.5" fill="#EF4444"/>
    <circle cx="64" cy="45" r="5.5" fill="#EAB308"/>
    <circle cx="82" cy="45" r="5.5" fill="#22C55E"/>
    <text x="104" y="49" font-size="13" fill="#94A3B8">devakikowsik-star@profile:~</text>
    <g>
      <circle cx="1112" cy="45" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="1146" y="49" font-size="11" fill="#10B981" text-anchor="end">[ ONLINE ]</text>
    </g>
  </g>

  <!-- LEFT PANEL -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="24" y="82" width="436" height="504" rx="16" fill="#0F172A" fill-opacity="0.30" stroke="#1E293B" stroke-width="1"/>
    <rect x="24" y="82" width="436" height="504" rx="16" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.25" stroke-width="1"/>

    <text x="242" y="118" font-size="11" letter-spacing="1.5" fill="#22D3EE" text-anchor="middle" opacity="0.9">[ PROFILE / ENGINEERING ]</text>

    <!-- abstract dot-matrix identity glyph (no photo supplied) -->
    <g transform="translate(242,270)">
      <g font-size="15" text-anchor="middle" fill="#94A3B8">
        <!-- row-by-row reveal grid forming a rounded terminal glyph -->
        <g id="glyphRows">
          <text y="-96" opacity="0">  .:+*#%@#*+:.  <animate attributeName="opacity" values="0;1" begin="0.1s" dur=".3s" fill="freeze"/></text>
          <text y="-72" opacity="0"> :+#%@@@@@@%#+: <animate attributeName="opacity" values="0;1" begin="0.25s" dur=".3s" fill="freeze"/></text>
          <text y="-48" opacity="0">+%@@#:.  .:#@@%+<animate attributeName="opacity" values="0;1" begin="0.4s" dur=".3s" fill="freeze"/></text>
          <text y="-24" opacity="0">%@@:  &lt;/&gt;  :@@%<animate attributeName="opacity" values="0;1" begin="0.55s" dur=".3s" fill="freeze"/></text>
          <text y="0"   opacity="0">%@@:        :@@%<animate attributeName="opacity" values="0;1" begin="0.7s" dur=".3s" fill="freeze"/></text>
          <text y="24"  opacity="0">+%@@#:.  .:#@@%+<animate attributeName="opacity" values="0;1" begin="0.85s" dur=".3s" fill="freeze"/></text>
          <text y="48"  opacity="0"> :+#%@@@@@@%#+: <animate attributeName="opacity" values="0;1" begin="1.0s" dur=".3s" fill="freeze"/></text>
          <text y="72"  opacity="0">  .:+*#%@#*+:.  <animate attributeName="opacity" values="0;1" begin="1.15s" dur=".3s" fill="freeze"/></text>
        </g>
      </g>
      <animateTransform attributeName="transform" type="translate" values="242,270; 242,266; 242,270" dur="6s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- scanline -->
    <rect x="44" y="130" width="396" height="1" fill="#22D3EE" opacity="0.35">
      <animate attributeName="y" values="130;540;130" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="242" y="420" font-size="20" font-weight="600" fill="#F8FAFC" text-anchor="middle">Developer</text>
    <text x="242" y="444" font-size="12" fill="#94A3B8" text-anchor="middle">Building on GitHub</text>

    <text x="242" y="548" font-size="13" fill="#22D3EE" text-anchor="middle">
      ~/profile $ build --ship
      <tspan fill="#F8FAFC">_</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- RIGHT PANEL -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="484" y="82" width="672" height="504" rx="16" fill="#0F172A" fill-opacity="0.30" stroke="#1E293B" stroke-width="1"/>
    <rect x="484" y="82" width="672" height="504" rx="16" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.25" stroke-width="1"/>

    <text x="508" y="116" font-size="14" font-weight="700" letter-spacing="1" fill="#F8FAFC">SYSTEM.INFO</text>
    <text x="508" y="138" font-size="11" fill="#22D3EE">devakikowsik-star@profile:~$ ./profile.sh</text>
    <line x1="508" y1="150" x2="1132" y2="150" stroke="#1E293B" stroke-width="1"/>

    <!-- info rows -->
    <g font-size="12">
      <text x="508" y="178" fill="#64748B">&gt; NAME</text>
      <text x="620" y="178" fill="#F8FAFC">devakikowsik-star</text>

      <text x="508" y="202" fill="#64748B">&gt; ROLE</text>
      <text x="620" y="202" fill="#F8FAFC">Developer</text>

      <text x="508" y="226" fill="#64748B">&gt; GITHUB</text>
      <text x="620" y="226" fill="#F8FAFC">github.com/devakikowsik-star</text>
    </g>

    <line x1="508" y1="250" x2="1132" y2="250" stroke="#1E293B" stroke-width="1"/>
    <text x="508" y="276" font-size="13" font-weight="700" letter-spacing="1" fill="#F8FAFC">PROJECTS</text>

    <!-- project rows -->
    <g font-size="12">
      <circle cx="512" cy="303" r="2.5" fill="#7C3AED"/>
      <text x="524" y="308" fill="#F8FAFC" font-weight="600">risk-sheid-ai</text>
      <text x="524" y="326" fill="#94A3B8">AI-related repository</text>

      <circle cx="512" cy="355" r="2.5" fill="#22D3EE"/>
      <text x="524" y="360" fill="#F8FAFC" font-weight="600">logistics-route-agent</text>
      <text x="524" y="378" fill="#94A3B8">Route-planning agent project</text>

      <circle cx="512" cy="407" r="2.5" fill="#10B981"/>
      <text x="524" y="412" fill="#F8FAFC" font-weight="600">CodeAlpha_WebScraping</text>
      <text x="524" y="430" fill="#94A3B8">Web scraping project</text>

      <circle cx="512" cy="459" r="2.5" fill="#7C3AED"/>
      <text x="524" y="464" fill="#F8FAFC" font-weight="600">SCT_WD_2</text>
      <text x="524" y="482" fill="#94A3B8">Web development repository</text>
    </g>

    <line x1="508" y1="505" x2="1132" y2="505" stroke="#1E293B" stroke-width="1"/>
    <text x="508" y="530" font-size="13" font-weight="700" letter-spacing="1" fill="#F8FAFC">LINKS</text>
    <g font-size="12">
      <text x="508" y="556" fill="#64748B">&gt; GITHUB</text>
      <text x="620" y="556" fill="#22D3EE">github.com/devakikowsik-star</text>
    </g>
  </g>
</svg>
